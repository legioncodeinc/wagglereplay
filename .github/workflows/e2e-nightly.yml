name: E2E (nightly + on demand)

# The three real-seam E2E suites (HANDOFF-4 section 7, prd-012 AC5's
# repository scope): replay (real Chromium + real ffmpeg replay-to-compose),
# studio (built loopback server), extension (registration and alignment
# seam). Scheduled nightly plus workflow_dispatch; these are expensive
# (browser + ffmpeg) so they stay out of per-PR required checks until
# prd-012 wires the release-tag requirement. Actions pinned to full
# commit SHAs.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "9.0"

      # The E2E suites resolve Chromium from the Playwright browser cache
      # (ms-playwright) or WAGGLE_CHROMIUM_PATH. playwright-core ships the
      # browser installer CLI; cache its download per Chromium build.
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        if: runner.os == 'Windows'

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        if: runner.os == 'Linux'

      - name: Install Playwright Chromium
        run: pnpm --filter @waggle/replay exec playwright-core install chromium

      - name: Build
        run: pnpm run --if-present build

      - name: Replay E2E (real Chromium + ffmpeg)
        run: pnpm --filter @waggle/replay e2e

      - name: Studio E2E (built loopback server)
        run: pnpm --filter @waggle/studio e2e

      - name: Extension E2E (registration seam)
        run: pnpm --filter @waggle/extension e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: |
            library/requirements/completed/prd-009-replay-engine/qa/
          if-no-files-found: ignore
          retention-days: 14
