name: CI (OS matrix)

# OS coverage for the two platforms the product ships installers for
# (HANDOFF-4 section 7): Windows and macOS run typecheck + build + test.
# The primary dev machine is Windows; until this workflow existed, no
# workflow had ever run on either platform. Lint stays on ubuntu (CI):
# it is OS-neutral. Actions pinned to full commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # compose/ingest shell out to real ffmpeg (ADR-003) and deliberately
      # never skip when absent. Windows: same static-build action as CI's
      # ubuntu job (windows build). macOS: homebrew ffmpeg is a current
      # full build carrying every encoder the preflight names.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "9.0"

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Build
        run: pnpm run --if-present build

      - name: Test
        run: pnpm run --if-present test
